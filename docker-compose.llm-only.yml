version: "3.9"

# LLM-only isolation test.
# Whisper is absent; vLLM can claim up to 95% of H200 VRAM for weights + KV cache.
# 20B FP16 model uses ~40 GB for weights; remaining ~94 GB becomes KV cache.
#
# Usage:
#   docker compose -f docker-compose.llm-only.yml up -d --build

x-gpu: &gpu
  driver: nvidia
  capabilities: [gpu]
  device_ids: ["0"]

services:
  llm:
    build:
      context: ./services/llm
    image: bench-llm
    ports:
      - "8002:8002"
    environment:
      LLM_MODEL_PATH:    ${LLM_MODEL_PATH:-/models/gpt-oss-20b}
      LLM_GPU_UTIL:      ${LLM_GPU_UTIL:-0.95}
      LLM_MAX_MODEL_LEN: ${LLM_MAX_MODEL_LEN:-8192}
      LLM_MAX_NUM_SEQS:  ${LLM_MAX_NUM_SEQS:-256}
      LLM_DTYPE:         ${LLM_DTYPE:-float16}
    deploy:
      resources:
        reservations:
          devices: [*gpu]
    volumes:
      - ${LLM_MODEL_HOST_PATH:-./models}:/models
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 8
    restart: unless-stopped

  gpu_monitor:
    image: python:3.11-slim
    command: python /monitor/gpu_monitor.py
    network_mode: host
    privileged: true
    volumes:
      - ./metrics:/monitor
      - ./results:/results
    environment:
      POLL_INTERVAL_MS: 500
      OUTPUT_FILE:      /results/gpu_metrics_llm_only.jsonl
    depends_on:
      - llm
    restart: unless-stopped
