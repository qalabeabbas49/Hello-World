version: "3.9"

# Whisper-only isolation test.
# The LLM service is absent; the full 141 GB H200 VRAM is available to Whisper.
# Set WHISPER_WORKERS to a high value (e.g. 32) to probe true GPU saturation.
#
# Usage:
#   WHISPER_MODEL=large-v2 WHISPER_WORKERS=16 \
#     docker compose -f docker-compose.whisper-only.yml up -d --build

x-gpu: &gpu
  driver: nvidia
  capabilities: [gpu]
  device_ids: ["0"]

services:
  whisper:
    build:
      context: ./services/whisper
      args:
        WHISPER_BACKEND:      ${WHISPER_BACKEND:-faster_whisper}
        WHISPER_MODEL:        ${WHISPER_MODEL:-large-v2}
        WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
    image: bench-whisper:${WHISPER_MODEL:-large-v2}
    ports:
      - "8001:8001"
    environment:
      WHISPER_BACKEND:      ${WHISPER_BACKEND:-faster_whisper}
      WHISPER_MODEL:        ${WHISPER_MODEL:-large-v2}
      WHISPER_WORKERS:      ${WHISPER_WORKERS:-16}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
      WHISPER_DEVICE:       cuda
    deploy:
      resources:
        reservations:
          devices: [*gpu]
    volumes:
      - whisper_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    restart: unless-stopped

  gpu_monitor:
    image: python:3.11-slim
    command: python /monitor/gpu_monitor.py
    network_mode: host
    privileged: true
    volumes:
      - ./metrics:/monitor
      - ./results:/results
    environment:
      POLL_INTERVAL_MS: 500
      OUTPUT_FILE:      /results/gpu_metrics_whisper_only.jsonl
    depends_on:
      - whisper
    restart: unless-stopped

volumes:
  whisper_cache:
